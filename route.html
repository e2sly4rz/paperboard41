<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Маршрутная квитанция — Картонный Экспресс</title>
    <style>
        body {
            background-color: #f4e4bc;
            font-family: 'Courier New', Courier, monospace;
            color: #333;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
        .ticket-container {
            width: 800px;
            border: 4px double #a08b6b;
            padding: 20px;
            background-color: #fdf5e6;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .meta-info {
            font-size: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .legend {
            font-size: 12px;
            margin-bottom: 15px;
            color: #555;
        }
        .wagon-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            margin-bottom: 8px;
            border-top: 2px solid #a08b6b;
            padding-top: 10px;
        }
        .wagon-title:first-of-type {
            margin-top: 0;
        }
        .pseudo-table-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
        }
        .pseudo-table-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #888;
            padding: 2px 0;
        }
        .pseudo-table-row:last-child {
            border-bottom: none;
        }
        .col-time, .col-game, .col-seats {
            flex: 1;
            white-space: nowrap;
        }
        .seats-block {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            align-items: center;
        }
        .seat {
            width: 14px;
            height: 14px;
            border: 1px solid #000;
            display: inline-block;
            box-sizing: border-box;
        }
        .seat.occupied {
            background-color: #000;
        }
        .perforation {
            position: absolute;
            width: 100%;
            height: 10px;
            top: 0;
            left: 0;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 5px);
            border-bottom: 2px double #000;
        }
        .perforation.bottom {
            top: auto;
            bottom: 0;
            border-top: 2px double #000;
            border-bottom: none;
        }
        .stamp {
            position: absolute;
            top: 40px;
            right: 20px;
            color: #b00;
            font-weight: bold;
            font-size: 20px;
            transform: rotate(-15deg);
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        .serial {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 12px;
            color: #777;
        }

        .sold-out-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .sold-out-overlay.visible {
            display: flex;
        }
        .sold-out-overlay .stamp-text {
            color: #c00;
            font-weight: bold;
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 6px;
            transform: rotate(-25deg);
            opacity: 0.55;
            border: 6px solid #c00;
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
        }
        </style>
</head>
<body>
    <div class="ticket-container" id="ticket">
        <div class="perforation"></div>
        <div class="perforation bottom"></div>

        <div class="header">Маршрутная квитанция</div>
        <div class="meta-info">
            Перевозчик: «Картонный Экспресс» | Дата отправления: 02.10.2026
        </div>
        <div class="meta-info">
            Платформа: ГЦ «Станция»
        </div>
        <div class="legend">
            Легенда: <span class="seat" style="vertical-align:middle"></span> — свободное место, <span class="seat occupied" style="vertical-align:middle"></span> — занятое место.
        </div>

        <!-- Вагоны генерируются JavaScript из массива wagons (ниже) -->
        <div id="wagons-container"></div>

        <div class="sold-out-overlay" id="soldOutOverlay"><span class="stamp-text">Свободных мест нет</span></div>
    </div>

    <script>
    const wagons = [
        {
            name: "Вагон №1",
            rows: [
                { time: "19:00–20:00", game: "Sushi Go Party!", seatsOccupied: 2, seatsTotal: 8 },
                { time: "20:00–22:00", game: "Тираны Подземья", seatsOccupied: 2, seatsTotal: 4 },
                { time: "22:00–23:00", game: "Омерта", seatsOccupied: 2, seatsTotal: 5 },
            ]
        },
        {
            name: "Вагон №2",
            rows: [
                { time: "19:00–21:00", game: "Шарлатаны из Кведлинбурга", seatsOccupied: 1, seatsTotal: 4 },
                { time: "21:00–23:00", game: "Правители Флоренции", seatsOccupied: 2, seatsTotal: 5 },
            ]
        },
    ];

    function makeSeats(occupied, total) {
        let html = '<span class="seats-block">';
        const free = total - occupied;
        for (let i = 0; i < total; i++) {
            html += '<span class="seat' + (i < occupied ? ' occupied' : '') + '"></span>';
        }
        html += '</span>';
        return html;
    }

    function renderWagons() {
        const container = document.getElementById('wagons-container');
        let html = '';
        wagons.forEach(function(w) {
            html += '<div class="wagon-title">' + w.name + '</div>';
            html += '<div class="pseudo-table-header">';
            html += '<span class="col-time">Время в пути</span>';
            html += '<span class="col-game">Купе</span>';
            html += '<span class="col-seats">Свободные места</span>';
            html += '</div>';
            w.rows.forEach(function(row) {
                html += '<div class="pseudo-table-row">';
                html += '<span class="col-time">' + row.time + '</span>';
                html += '<span class="col-game">' + row.game + '</span>';
                html += '<span class="col-seats">' + makeSeats(row.seatsOccupied, row.seatsTotal) + '</span>';
                html += '</div>';
            });
        });
        container.innerHTML = html;
    }

    renderWagons();

    // --- Плашка "Свободных мест нет" ---
    const allSoldOut = true; // true — показать плашку, false — скрыть
    if (allSoldOut) {
        document.getElementById('soldOutOverlay').classList.add('visible');
    }

    </script>
</body>
</html>
