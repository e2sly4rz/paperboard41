<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Картонный Экспресс | Каталог игр</title>

  <!-- Тема применяется до первой отрисовки, чтобы не было мигания -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css">

  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
      (function(m,e,t,r,i,k,a){
          m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
          m[i].l=1*new Date();
          for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
          k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
      })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=114079006', 'ym');

      ym(114079006, 'init', {ssr:true, webvisor:true, clickmap:true, referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/114079006" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->

</head>
<body>
  <main class="print-sheet">
    <h2>Картонный Экспресс | Каталог игр</h2>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему" title="Переключить тему">
      <span class="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <p class="legend">
      Шкала сложности: █ — 0.5 балла. 1 балл = █░░░░░░░░, 5 баллов = █████████
      &nbsp;·&nbsp; 🔒 — особый вагон
    </p>

    <form class="controls" id="filters" role="search" aria-label="Фильтры каталога">
      <div class="control">
        <label for="search">Поиск:</label>
        <input type="search" id="search" placeholder="название…" autocomplete="off">
      </div>

      <div class="control">
        <label for="filter-difficulty">Сложность:</label>
        <select id="filter-difficulty">
          <option value="any">Любая</option>
          <option value="0.5-1">до 1 (очень просто)</option>
          <option value="1-2">1–2 (просто)</option>
          <option value="2-3">2–3 (средне)</option>
          <option value="3-4">3–4 (сложно)</option>
          <option value="4-5">4–5 (хардкор)</option>
        </select>
      </div>

      <div class="control">
        <label for="filter-genre">Жанр:</label>
        <select id="filter-genre">
          <option value="">Все</option>
        </select>
      </div>

      <div class="control">
        <label for="filter-players">Игроки:</label>
        <select id="filter-players">
          <option value="0">Любое</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
          <option value="5">5+</option>
          <option value="6">6+</option>
        </select>
      </div>

      <div class="control">
        <label for="filter-access">Доступ:</label>
        <select id="filter-access">
          <option value="all">Любой</option>
          <option value="yes">Только особый вагон</option>
          <option value="no">Только обычные</option>
        </select>
      </div>

      <button type="button" class="reset-btn" id="reset">Сбросить</button>
    </form>

    <div class="count" id="count" aria-live="polite"></div>

    <div class="table-wrap">
      <table class="catalog-table">
        <thead>
          <tr>
            <th class="col-num sortable" data-sort="num" aria-sort="none">
              <button type="button" class="sort-btn">№<span class="sort-arrow"></span></button>
            </th>
            <th class="col-name sortable" data-sort="name" aria-sort="ascending">
              <button type="button" class="sort-btn">Игра<span class="sort-arrow"></span></button>
            </th>
            <th class="col-scale sortable" data-sort="difficulty" aria-sort="none">
              <button type="button" class="sort-btn">Сложность<span class="sort-arrow"></span></button>
            </th>
            <th class="col-players sortable" data-sort="players" aria-sort="none">
              <button type="button" class="sort-btn">Игроки<span class="sort-arrow"></span></button>
            </th>
            <th class="col-time sortable" data-sort="time" aria-sort="none">
              <button type="button" class="sort-btn">Время<span class="sort-arrow"></span></button>
            </th>
            <th class="col-genre sortable" data-sort="genre" aria-sort="none">
              <button type="button" class="sort-btn">Жанр<span class="sort-arrow"></span></button>
            </th>
            <th class="col-access sortable" data-sort="access" aria-sort="none">
              <button type="button" class="sort-btn">Доступ<span class="sort-arrow"></span></button>
            </th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>
        <p>Ничего не найдено.</p>
        <button type="button" class="reset-btn" id="reset-empty">Сбросить фильтры</button>
      </div>
    </div>
  </main>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
