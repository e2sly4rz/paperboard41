<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон: выцветшая бумага -->
  <rect width="64" height="64" fill="#f0e6d2"/>
  <!-- Внутренняя рамка: как у штампа -->
  <rect x="6" y="6" width="52" height="52" fill="none" stroke="#8b3a1f" stroke-width="3"/>
  <!-- Буква "К" — моноширинная, как на матричном принтере -->
  <text x="32" y="46"
        font-family="Courier New, Courier, monospace"
        font-size="36"
        font-weight="bold"
        fill="#8b3a1f"
        text-anchor="middle">К</text>
</svg>