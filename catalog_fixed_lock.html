<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Картонный Экспресс | Каталог игр</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #f4f1ea;
    font-family: sans-serif;
  }

  .print-sheet {
    width: 940px;
    max-width: 100%;
    margin: 0 auto;
    background: #f5e6b3;
    border: 4px solid #d4c39a;
    border-left: 12px solid #d4c39a;
    border-right: 12px solid #d4c39a;
    padding: 28px 36px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    position: relative;
  }

  .print-sheet::before,
  .print-sheet::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 8px;
    background-image: radial-gradient(circle at center, transparent 4px, #cfa07a 4.5px);
    background-size: 16px 16px;
  }
  .print-sheet::before { left: -12px; }
  .print-sheet::after { right: -12px; }

  h2 {
    text-align: center;
    color: #222;
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
    margin-top: 0;
    text-transform: uppercase;
  }

  .legend {
    text-align: center;
    font-family: "Courier New", Courier, monospace;
    color: #444;
    font-size: 14px;
    margin-bottom: 16px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 8px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    color: #333;
  }

  .controls label {
    font-weight: bold;
    margin-right: 4px;
  }

  .controls input[type="text"],
  .controls select {
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    background: #fffaeb;
    border: 1px solid #c4b380;
    padding: 4px 8px;
    color: #222;
  }

  .controls select {
    cursor: pointer;
  }

  .count {
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    color: #555;
    margin-bottom: 10px;
  }

  .catalog-table {
    width: 100%;
    border-collapse: collapse;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    color: #1a1a1a;
    table-layout: fixed;
  }

  .catalog-table th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid #b8a878;
    color: #333;
    white-space: nowrap;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .catalog-table td {
    padding: 5px 10px;
    border-bottom: 1px dashed #c9bb88;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .catalog-table tr:hover td {
    background: #ede0b0;
  }

  .col-num     { width: 25px; text-align: left; }
  .catalog-table td.col-name { width: auto; white-space: normal; overflow-wrap: break-word; overflow: visible; text-overflow: clip; }
  .col-scale   { width: 120px; font-size: 15px; letter-spacing: 1px; }
  .col-players { width: 70px; text-align: left; }
  .col-time    { width: 90px; }
  .col-genre   { width: 110px; }
  .col-access  { width: 50px; text-align: center; }

  /* === Раскрывающаяся панель дополнений === */
  .expansion-row td {
    padding: 0 !important;
    border: none !important;
    background: #efe2b5 !important;
  }
  .expansion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease;
    padding: 0 20px;
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    color: #333;
  }
  .expansion-content.open {
    max-height: 500px;
    padding: 8px 20px 12px 20px;
  }
  .expansion-content ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .expansion-content li {
    padding: 2px 0 2px 16px;
    position: relative;
  }
  .expansion-content li::before {
    content: "•";
    position: absolute;
    left: 2px;
  }
  .expansion-content .no-exp {
    font-style: italic;
    color: #888;
    padding-left: 0;
  }
  .game-row { cursor: pointer; }

  /* ===== ПЛАНШЕТЫ: лёгкая адаптация ===== */
  @media (max-width: 900px) {
    .print-sheet {
      width: 100%;
      padding: 24px 20px;
    }
  }

  /* ===== СМАРТФОНЫ: карточки вместо таблицы ===== */
  @media (max-width: 640px) {
    body {
      padding: 12px 8px;
    }

    .print-sheet {
      padding: 18px 14px;
      border-left: 8px solid #d4c39a;
      border-right: 8px solid #d4c39a;
    }

    h2 {
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .legend {
      font-size: 12px;
      line-height: 1.5;
    }

    /* --- Фильтры: вертикально, на всю ширину --- */
    .controls {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .controls label {
      margin-bottom: 2px;
      font-size: 12px;
    }
    .controls input[type="text"],
    .controls select {
      width: 100%;
      font-size: 15px;
      padding: 8px 10px;
    }

    /* --- Прячем заголовок таблицы --- */
    .catalog-table thead { display: none; }

    /* --- Таблица -> карточки --- */
    .catalog-table,
    .catalog-table tbody,
    .catalog-table tr,
    .catalog-table td {
      display: block;
      width: 100%;
    }

    .catalog-table tr.game-row {
      position: relative;
      border: 1px solid #c9bb88;
      border-radius: 6px;
      margin-bottom: 8px;
      padding: 10px 12px;
      background: #f5e6b3;
    }

    .catalog-table tr.game-row td {
      border: none;
      padding: 2px 0;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    /* Номер и доступ — в одну строку сверху */
    .catalog-table tr.game-row td.col-num {
      display: inline-block;
      width: auto;
      font-weight: bold;
      color: #777;
      font-size: 12px;
    }
    .catalog-table tr.game-row td.col-access {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 16px;
    }

    /* Название игры — крупно */
    .catalog-table tr.game-row td.col-name {
      font-weight: bold;
      font-size: 15px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    /* Сложность, игроки, время, жанр — в виде "Метка: значение" */
    .catalog-table tr.game-row td.col-scale::before { content: "Сложность: "; font-weight: bold; font-size: 12px; }
    .catalog-table tr.game-row td.col-players::before { content: "Игроки: "; font-weight: bold; font-size: 12px; }
    .catalog-table tr.game-row td.col-time::before { content: "Время: "; font-weight: bold; font-size: 12px; }
    .catalog-table tr.game-row td.col-genre::before { content: "Жанр: "; font-weight: bold; font-size: 12px; }

    .catalog-table tr.game-row td.col-scale { font-size: 14px; }
    .catalog-table tr.game-row td.col-players,
    .catalog-table tr.game-row td.col-time,
    .catalog-table tr.game-row td.col-genre { font-size: 13px; }

    /* --- Панель дополнений на мобильном --- */
    .expansion-row td { display: block !important; }
    .expansion-content { font-size: 13px; }
    .expansion-content.open { padding: 8px 12px 10px 12px; }
  }
</style>
</head>

// === Шкала сложности: 9 символов ===
function makeScale(score) {
  const total = 9;
  const filled = Math.round((score - 0.5) * 2);
  return '[' + '\u2588'.repeat(filled) + '\u2591'.repeat(total - filled) + ']';
}

// === Заполняем фильтр по жанрам ===
const genres = [...new Set(games.map(g => g[5]))].sort();
const genreSelect = document.getElementById('filter-genre');
genres.forEach(g => {
  const opt = document.createElement('option');
  opt.value = g;
  opt.textContent = g;
  genreSelect.appendChild(opt);
});

// === Рендер таблицы ===
const tbody = document.getElementById('tbody');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('search');
const diffSelect = document.getElementById('filter-difficulty');
const genreSel = document.getElementById('filter-genre');
const playersSelect = document.getElementById('filter-players');
const accessSelect = document.getElementById('filter-access');

let openRowIndex = -1;

function render() {
  const q = searchInput.value.toLowerCase().trim();
  const d = parseFloat(diffSelect.value);
  const g = genreSel.value;
  const p = parseInt(playersSelect.value);
  const a = accessSelect.value;

  const filtered = games
    .filter(game => {
      if (q && !game[0].toLowerCase().includes(q)) return false;
      if (d > 0 && Math.abs(game[1] - d) > 0.01) return false;
      if (g && game[5] !== g) return false;
      if (p >  0 && game[3] < p) return false;
      if (a === 'yes' && !game[6]) return false;
      if (a === 'no' && game[6]) return false;
      return true;
    })
    .sort((a, b) => a[0].localeCompare(b[0], 'ru'));

  openRowIndex = -1;

  tbody.innerHTML = filtered.map((game, i) => {
    const scale = makeScale(game[1]);
    const players = game[2] === game[3] ? `${game[2]}` : `${game[2]}\u2013${game[3]}`;
    const access = game[6] ? '\uD83D\uDD12' : '';
    const expansions = game[7] || [];

    let expHtml;
    if (expansions.length > 0) {
      expHtml = '<ul>' + expansions.map(e => `<li>${e}</li>`).join('') + '</ul>';
    } else {
      expHtml = '<div class="no-exp">Дополнений нет в наличии</div>';
    }

    return `<tr class="game-row" data-index="${i}">
      <td class="col-num">${i + 1}</td>
      <td class="col-name">${game[0]}</td>
      <td class="col-scale">${scale}</td>
      <td class="col-players">${players}</td>
      <td class="col-time">${game[4]}</td>
      <td class="col-genre">${game[5]}</td>
      <td class="col-access">${access}</td>
    </tr>
    <tr class="expansion-row" data-exp-for="${i}">
      <td colspan="7">
        <div class="expansion-content" id="exp-${i}">
          <strong>Дополнения:</strong><br>
          ${expHtml}
        </div>
      </td>
    </tr>`;
  }).join('');

  countEl.textContent = `\u041d\u0430\u0439\u0434\u0435\u043d\u043e: ${filtered.length} \u0438\u0437 ${games.length}`;

  // Навешиваем клики
  tbody.querySelectorAll('.game-row').forEach(row => {
    row.addEventListener('click', function() {
      const idx = parseInt(this.dataset.index);
      const panel = document.getElementById('exp-' + idx);

      if (openRowIndex === idx) {
        panel.classList.remove('open');
        openRowIndex = -1;
      } else {
        if (openRowIndex >= 0) {
          const prev = document.getElementById('exp-' + openRowIndex);
          if (prev) prev.classList.remove('open');
        }
        panel.classList.add('open');
        openRowIndex = idx;
      }
    });
  });
}

searchInput.addEventListener('input', render);
diffSelect.addEventListener('change', render);
genreSel.addEventListener('change', render);
playersSelect.addEventListener('change', render);
accessSelect.addEventListener('change', render);

render();
</script>
